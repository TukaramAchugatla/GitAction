name: Build the React App
on: [push,workflow_dispatch]
jobs:
    Run_Test:
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/checkout@v6
            - name: Install Node
              uses: actions/setup-node@v6
              with:
                node-version: '20'
            - name: Cache Node Modules
              uses: actions/cache@v5
              with:
                path: ~/.npm
                key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}   ## It will Generate a unique key based on the OS and the hash of the package-lock.json file
            - name: Install Dependences
              run: npm ci 
            - name: Run Test
              run: npm test
    Deploy:
        needs: Run_Test
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/checkout@v6
            - name: Install Node
              uses: actions/setup-node@v6
              with:
                node-version: '20'
            - name: Cache Node Modules
              uses: actions/cache@v5
              with:
                path: ~/.npm
                key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
            - name: Install Dependences
              run: npm ci 
            - name: Build Project
              run: npm run build
            - name: Deploy
              run: echo "Deploying to production server..."