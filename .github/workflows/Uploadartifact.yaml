name: Branches
# on: [push,workflow_dispatch]
on:
  push:
    branches:
      - main
      - feature/**
    paths-ignore: 
      - README.md
      - '.github/workflows/**'
  workflow_dispatch:
jobs:
    Run_Test:
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/checkout@v6
            - name: Install Node
              uses: actions/setup-node@v6
              with:
                node-version: '20'
            - name: Cache Dependences
              uses: actions/cache@v5
              with:
                path: ~/.npm
                key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}  
            - name: Install Dependences
              run: npm ci 
            - name: Run Test
              run: npm test
    Build:
        needs: Run_Test
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/checkout@v6
            - name: Install Node
              uses: actions/setup-node@v6
              with:
                node-version: '20'
            - name: Cache Dependences
              uses: actions/cache@v5
              with:
                path: ~/.npm
                key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
            - name: Install Dependences
              run: npm ci 
            - name: Build Project
              run: npm run build
            - name: Upload Artifact
              uses: actions/upload-artifact@v4
              with:
                name: dist-files
                path: dist
    Deploy:
        needs: Build
        runs-on: ubuntu-latest
        steps:
            - name: Download Artifact
              uses: actions/download-artifact@v5
              with:
                name: dist-files
                path: dist
            - name: Get Code
              run: echo "Getting code..."